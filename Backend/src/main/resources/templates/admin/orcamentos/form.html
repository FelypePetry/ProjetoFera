<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Orçamento - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="flex">
    <div th:replace="~{fragments/admin-layout :: sidebar}"></div>
    <main class="flex-1 p-8 ml-64">
        <div class="flex items-center gap-3 mb-6">
            <a th:href="@{/admin/orcamentos}" class="text-gray-500 hover:text-gray-800">← Voltar</a>
            <h1 class="text-2xl font-bold text-gray-800"
                th:text="${orcamento.id != null} ? 'Editar Orçamento' : 'Novo Orçamento'">Orçamento</h1>
        </div>

        <div th:replace="~{fragments/admin-layout :: alertas}"></div>

        <div class="bg-white rounded-xl shadow p-6 max-w-2xl">
            <form th:action="${orcamento.id != null} ? @{/admin/orcamentos/editar/{id}(id=${orcamento.id})} : @{/admin/orcamentos/novo}"
                  th:object="${orcamento}" method="post" enctype="multipart/form-data">

                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Móvel *</label>
                        <input type="text" th:field="*{tipoMovel}"
                               class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"/>
                        <p th:if="${#fields.hasErrors('tipoMovel')}" th:errors="*{tipoMovel}" class="text-red-500 text-xs mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Medidas</label>
                        <input type="text" th:field="*{medidas}"
                               class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"/>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Usuário *</label>
                        <select th:field="*{usuario}" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nome}"></option>
                        </select>
                    </div>

                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Produtos</label>
                        <select th:field="*{produtosSelecionadosIds}" multiple class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option th:each="p : ${produtos}" th:value="${p.id}" th:text="${p.nome}"></option>
                        </select>
                    </div>

                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Observações</label>
                        <textarea th:field="*{observacoes}" rows="3"
                                  class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
                    </div>

                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Imagem</label>
                        <input type="file" name="imagem" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"/>
                    </div>
                </div>

                <div class="mt-6 flex gap-3">
                    <button type="submit"
                            class="bg-green-700 text-white px-6 py-2 rounded hover:bg-green-800">
                        Salvar
                    </button>
                    <a th:href="@{/admin/orcamentos}"
                       class="bg-gray-200 text-gray-700 px-6 py-2 rounded hover:bg-gray-300">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
