<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Detalhe do Produto - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="flex">
    <div th:replace="~{fragments/admin-layout :: sidebar}"></div>
    <main class="flex-1 p-8 ml-64">
        <div class="flex items-center gap-3 mb-6">
            <a th:href="@{/admin/produtos}" class="text-gray-500 hover:text-gray-800">← Voltar</a>
            <h1 class="text-2xl font-bold text-gray-800" th:text="${produto.nome}">Nome do Produto</h1>
        </div>

        <div class="bg-white rounded-xl shadow p-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="md:col-span-1">
                    <h2 class="text-lg font-semibold text-gray-700 mb-2">Imagem</h2>
                    <div th:if="${!#lists.isEmpty(produto.imagens)}" class="w-full h-64 bg-gray-200 rounded-lg overflow-hidden">
                        <img th:src="@{'/uploads/' + ${produto.imagens[0].urlImagem}}" alt="Imagem do Produto" class="w-full h-full object-cover"/>                    <div th:if="${#lists.isEmpty(produto.imagens)}" class="w-full h-64 bg-gray-200 rounded-lg flex items-center justify-center text-gray-500">
                        Sem imagem
                    </div>
                </div>
                <div class="md:col-span-2">
                    <h2 class="text-lg font-semibold text-gray-700 mb-2">Detalhes</h2>
                    <dl class="grid grid-cols-2 gap-x-4 gap-y-2">
                        <dt class="font-medium text-gray-500">Código</dt>
                        <dd th:text="${produto.codigo}">-</dd>

                        <dt class="font-medium text-gray-500">Categoria</dt>
                        <dd th:text="${produto.categoria != null ? produto.categoria.nome : '-'}">-</dd>

                        <dt class="font-medium text-gray-500">Preço</dt>
                        <dd th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 2)}">-</dd>

                        <dt class="font-medium text-gray-500">Estoque</dt>
                        <dd th:text="${produto.estoque}">-</dd>

                        <dt class="font-medium text-gray-500">Materiais</dt>
                        <dd>
                            <span th:each="mat, iter : ${produto.materiais}" th:text="${mat.nome} + (${iter.last} ? '' : ', ')"></span>
                        </dd>

                        <dt class="font-medium text-gray-500">Cores</dt>
                        <dd>
                            <span th:each="cor, iter : ${produto.cores}" th:text="${cor.nome} + (${iter.last} ? '' : ', ')"></span>
                        </dd>

                        <dt class="font-medium text-gray-500 col-span-2">Descrição</dt>
                        <dd class="col-span-2" th:text="${produto.descricao}">-</dd>
                    </dl>
                    <div class="mt-6">
                        <a th:href="@{/admin/produtos/editar/{id}(id=${produto.id})}" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800">
                            Editar Produto
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
