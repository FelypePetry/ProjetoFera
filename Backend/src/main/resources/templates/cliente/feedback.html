<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title>Feedback - Minha Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="flex">
    <div th:replace="~{fragments/cliente-layout :: sidebar}"></div>
    <main class="flex-1 p-8 ml-64">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Enviar Feedback</h1>

        <div th:if="${sucesso}" class="bg-green-100 border border-green-400 text-green-800 px-4 py-3 rounded mb-4">
            <span th:text="${sucesso}"></span>
        </div>

        <div class="bg-white rounded-xl shadow p-6 max-w-2xl">
            <form th:action="@{/minha-conta/feedback}" method="post">
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label for="idOrcamento" class="block text-sm font-medium text-gray-700 mb-1">Pedido (Orçamento)</label>
                        <select id="idOrcamento" name="idOrcamento" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option th:each="orc : ${orcamentos}" th:value="${orc.id}" th:text="'#' + ${orc.id} + ' - ' + ${orc.tipoMovel}"></option>
                        </select>
                    </div>
                    <div>
                        <label for="nota" class="block text-sm font-medium text-gray-700 mb-1">Nota</label>
                        <select id="nota" name="nota" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option th:each="n : ${T(com.grupoum.projeto_fera.model.Feedback.Nota).values()}" th:value="${n}" th:text="${n}"></option>
                        </select>
                    </div>
                    <div>
                        <label for="comentario" class="block text-sm font-medium text-gray-700 mb-1">Comentário</label>
                        <textarea id="comentario" name="comentario" rows="4" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
                    </div>
                </div>
                <div class="mt-6">
                    <button type="submit" class="bg-green-700 text-white px-6 py-2 rounded hover:bg-green-800">
                        Enviar Feedback
                    </button>
                </div>
            </form>
        </div>

        <h2 class="text-xl font-semibold text-gray-700 mt-8 mb-4">Meus Feedbacks</h2>
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <table class="w-full text-sm">
                <thead class="bg-gray-50 text-gray-500 text-left">
                    <tr>
                        <th class="px-4 py-3">Pedido</th>
                        <th class="px-4 py-3">Nota</th>
                        <th class="px-4 py-3">Comentário</th>
                        <th class="px-4 py-3">Data</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fb : ${meusFeedbacks}" class="border-t hover:bg-gray-50">
                        <td class="px-4 py-3" th:text="'#' + ${fb.orcamento.id}">-</td>
                        <td class="px-4 py-3" th:text="${fb.nota}">-</td>
                        <td class="px-4 py-3" th:text="${fb.comentario}">-</td>
                        <td class="px-4 py-3" th:text="${#temporals.format(fb.dataAvaliacao, 'dd/MM/yyyy')}">-</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(meusFeedbacks)}">
                        <td colspan="4" class="px-4 py-8 text-center text-gray-400">Nenhum feedback enviado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
