# ============================================================
# Conexão com PostgreSQL (ativo)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/FeraMetalurgica
spring.datasource.username=postgres
spring.datasource.password=bear5503
spring.datasource.driverClassName=org.postgresql.Driver

# Flyway gerencia o schema — migrations V1, V2 e V3 rodam em sequência
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA — validate garante que as entidades batem com o banco sem alterar tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

