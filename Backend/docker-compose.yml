version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fera_postgres
    environment:
      POSTGRES_DB: FeraMetalurgica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bear5503
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fera-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fera_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/FeraMetalurgica
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bear5503
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fera-network

volumes:
  postgres_data:

networks:
  fera-network:
    driver: bridge